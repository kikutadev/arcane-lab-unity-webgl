<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Arcane Bastion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #07090d; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #unity-canvas { width: 100vw; height: 100vh; display: block; background: #07090d; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
      background: radial-gradient(circle at 50% 48%, #15110d 0%, #090b0f 42%, #050609 100%);
      transition: opacity 240ms ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader { width: min(360px, 70vw); }
    .loader-title { color: #eee8df; font-size: 13px; letter-spacing: .24em; font-weight: 650; margin-bottom: 12px; }
    .track { height: 2px; width: 100%; background: #292d31; overflow: hidden; }
    #progress { width: 0%; height: 100%; background: #d98542; transition: width 80ms linear; }
    #warning { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; max-width: min(720px, 90vw); }
    #warning > div { color: #f4eee7; background: rgba(120, 42, 21, .96); padding: 9px 12px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div class="loader"><div class="loader-title">ARCANE BASTION</div><div class="track"><div id="progress"></div></div></div></div>
  <div id="warning"></div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#progress');
    const warning = document.querySelector('#warning');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('touchmove', event => event.preventDefault(), { passive: false });

    window.__arcanePointerQueue = [];
    window.__arcanePointerLast = null;
    let arcaneActivePointerId = null;
    const enqueueArcanePointer = (type, event) => {
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
      window.__arcanePointerQueue.push({ type, x, y, pointerType: event.pointerType || 'mouse' });
      if (window.__arcanePointerQueue.length > 512) window.__arcanePointerQueue.splice(0, window.__arcanePointerQueue.length - 512);
    };
    canvas.addEventListener('pointerdown', event => {
      if (arcaneActivePointerId !== null) return;
      arcaneActivePointerId = event.pointerId;
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      enqueueArcanePointer(1, event);
      event.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointermove', event => {
      if (event.pointerId !== arcaneActivePointerId) return;
      const coalesced = typeof event.getCoalescedEvents === 'function'
        ? event.getCoalescedEvents()
        : [];
      if (coalesced.length > 0) {
        for (const sample of coalesced) enqueueArcanePointer(2, sample);
      } else {
        enqueueArcanePointer(2, event);
      }
      event.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointerup', event => {
      if (event.pointerId !== arcaneActivePointerId) return;
      enqueueArcanePointer(3, event);
      try { canvas.releasePointerCapture(event.pointerId); } catch (_) {}
      arcaneActivePointerId = null;
      event.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointercancel', event => {
      if (event.pointerId !== arcaneActivePointerId) return;
      enqueueArcanePointer(4, event);
      arcaneActivePointerId = null;
      event.preventDefault();
    }, { passive: false });

    function showBanner(message, type) {
      const item = document.createElement('div');
      item.textContent = message;
      warning.appendChild(item);
      if (type !== 'error') setTimeout(() => item.remove(), 5000);
    }

    const buildUrl = 'Build';
    const buildId = '1790120303';
    const versioned = path => `${path}?v=${encodeURIComponent(buildId)}`;
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const renderScale = Math.min(window.devicePixelRatio || 1, 2);
    const mobileArguments = isMobile ? ['-arcaneMobile', '-arcaneUiScale', String(renderScale)] : [];
    const qaMode = new URLSearchParams(window.location.search).get('qa') === '1';
    const config = {
      arguments: mobileArguments,
      dataUrl: versioned(buildUrl + '/WebGLPages.data.unityweb'),
      frameworkUrl: versioned(buildUrl + '/WebGLPages.framework.js.unityweb'),
      codeUrl: versioned(buildUrl + '/WebGLPages.wasm.unityweb'),
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'kikutadev',
      productName: 'Arcane Bastion',
      productVersion: '1.0',
      showBanner,
      // DPR 1 made UI text visibly rasterized on high-density phones. Cap at 2 for a sharp/performant balance.
      devicePixelRatio: renderScale,
      cacheControl: () => 'no-store'
    };

    const script = document.createElement('script');
    script.src = versioned(buildUrl + '/WebGLPages.loader.js');
    script.onload = () => {
      createUnityInstance(canvas, config, value => { progress.style.width = `${Math.round(value * 100)}%`; })
        .then(instance => {
          window.__arcaneUnity = instance;
          if (qaMode) instance.SendMessage('CastleDefenseGame', 'QaEnable');
          loading.classList.add('hidden');
        })
        .catch(message => { showBanner(String(message), 'error'); loading.classList.add('hidden'); });
    };
    script.onerror = () => showBanner('Failed to load the Arcane Bastion WebGL runtime.', 'error');
    document.body.appendChild(script);
  </script>
</body>
</html>
